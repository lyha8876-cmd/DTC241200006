global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['pos_node_exporter_v2:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['pos_cadvisor_v2:8080']
