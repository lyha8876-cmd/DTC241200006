networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pos_app
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net
    environment:
      - DB_HOST=db
      - DB_USER=pos_user
      - DB_PASSWORD=PosSecurePass2026!
      - DB_NAME=pos_db

  db:
    image: mysql:8.0
    container_name: pos_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - backend_net
    environment:
      - MYSQL_ROOT_PASSWORD=RootSecurePass2026!
      - MYSQL_DATABASE=pos_db
      - MYSQL_USER=pos_user
      - MYSQL_PASSWORD=PosSecurePass2026!
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pos_phpmyadmin
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net
    environment:
      - PMA_HOST=db
      - PMA_USER=pos_user
      - PMA_PASSWORD=PosSecurePass2026!

  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend_net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx

  prometheus:
    image: prom/prometheus:latest
    container_name: pos_prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    networks:
      - frontend_net
      - backend_net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pos_cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - backend_net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node_exporter:
    image: prom/node-exporter:latest
    container_name: pos_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - backend_net

  loki:
    image: grafana/loki:latest
    container_name: pos_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - backend_net
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: pos_promtail
    user: root
    command: -config.file=/etc/promtail/config.yaml
    restart: unless-stopped
    networks:
      - backend_net
    volumes:
      - /home/ubuntu/DTC241200006/promtail/config.yaml:/etc/promtail/config.yaml
      - nginx_logs:/var/log/nginx:ro

  grafana:
    image: grafana/grafana:latest
    container_name: pos_grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    networks:
      - frontend_net
      - backend_net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
  nginx_logs:
  grafana_data:
